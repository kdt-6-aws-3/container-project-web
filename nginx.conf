# /etc/nginx/templates/default.conf.template 로 복사되어 envsubst 처리됨
# (${WAS_HOST}, ${WAS_PORT} 처럼 "정의된 환경변수"만 치환되고 $host 같은 nginx 변수는 그대로 유지)

# Ingress/LB 뒤에서는 $remote_addr가 Ingress Pod IP라 전체 사용자가 한 버킷을 공유하게 됨
# → 아래 real_ip 설정으로 실제 클라이언트 IP 기준 제한이 되도록 함
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# Ingress에서 TLS 종료 시 원래 프로토콜(https)을 WAS에 전달
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    # nginx-unprivileged (UID 101)는 1024 미만 포트 바인딩 불가
    listen 8080;
    server_name _;
    server_tokens off;

    # 클러스터 내부(Ingress Controller 등)에서 온 X-Forwarded-For만 신뢰
    # 사용 중인 Pod/Node CIDR에 맞게 좁히는 것을 권장
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # K8s probe 전용 (로그 제외)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 정적 자산: 장기 캐싱
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # WAS API 프록시
    # 주의: nginx는 기동 시 ${WAS_HOST}를 DNS 조회함 → WAS Service가 먼저 존재해야 함
    # (다른 네임스페이스면 WAS_HOST=was.<ns>.svc.cluster.local)
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_req_status 429;

        proxy_pass         http://${WAS_HOST}:${WAS_PORT}/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $fwd_proto;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    65s;
        proxy_send_timeout    10s;
    }

    # SPA 라우팅 폴백
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}